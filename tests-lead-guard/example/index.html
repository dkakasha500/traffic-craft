<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Guard — пример интеграции</title>
  <!-- Стили сайта, затем стили слайдера -->
  <link rel="stylesheet" href="../lead-guard.css" />
  <style>
    /* Минимальные стили примера — на реальном сайте используйте свои. */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f6fb; color: #1a2233; margin: 0; padding: 40px 16px; }
    .card { max-width: 440px; margin: 0 auto; background: #fff; border: 1px solid #e5eaf1; border-radius: 14px; padding: 24px; }
    .field-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .field-row { display: flex; gap: 10px; }
    .field-input { flex: 1; height: 54px; font-size: 16px; padding: 0 16px; border: 1px solid #e5eaf1; border-radius: 11px; }
    .field-input.is-invalid { border-color: #d23b2f; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 54px; padding: 0 24px; border: none; border-radius: 11px; background: #2f63e6; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .field-error { margin: 8px 0 0; font-size: 12.5px; color: #d23b2f; }
    @media (max-width: 600px) { .field-row { flex-direction: column; } .btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="card">
    <!--
      Требования к форме:
        • class="lead-form" (или свой formSelector в init)
        • data-form-location — метка формы для аналитики/сообщения (hero / bottom / popup …)
        • honeypot: <input class="hp-field" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        • поле контакта: name="contact"
        • кнопка: <button type="submit">
        • (необязательно) блок ошибки .field-error
      Разметку слайдера добавлять НЕ нужно — её создаёт lead-guard.js.
    -->
    <form class="lead-form" data-form-location="hero" novalidate>
      <input class="hp-field" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <label class="field-label" for="contact">Ваш Telegram или номер</label>
      <div class="field-row">
        <input class="field-input" id="contact" name="contact" type="text" inputmode="text"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
               placeholder="@username или +998 __ ___ __ __" aria-describedby="err" />
        <button class="btn" type="submit">Отправить заявку</button>
      </div>
      <p class="field-error" id="err" hidden>Укажите Telegram (@username) или номер телефона.</p>
    </form>
  </div>

  <script src="../lead-guard.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      LeadGuard.init({
        endpoint: "/api/lead",
        thankYouUrl: "thank-you.html",
        // Хук аналитики: сюда НИКОГДА не приходит контакт — только нейтральные параметры.
        onEvent: function (name, detail) {
          // пример: if (typeof fbq === "function") fbq("trackCustom", name, detail);
          console.log("LeadGuard event:", name, detail);
        }
      });
    });
  </script>
</body>
</html>
