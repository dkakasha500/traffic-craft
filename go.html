<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открываем чат — Traffic Craft</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e0e12">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Мост в мессенджер с бегунком (Lead Guard).
     Раньше мост открывал чат сам через 0.9с и стрелял Lead на загрузке - любой бот,
     дошедший до страницы, попадал в WhatsApp. Теперь чат открывается ТОЛЬКО после
     свайпа «Проведите вправо»: Lead/Contact в пиксель, заметка в группу и CAPI
     уходят в момент подтверждения, а не на загрузке.
     Ссылки сюда ведут БЕЗ target="_blank": дедупликация Lead живет в sessionStorage,
     а он у каждой вкладки свой.
     Параметры: ?m=wa|tg (мессенджер) &pl=метка-кнопки (латиница) -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('set', 'autoConfig', false, '2342435819568558');
fbq('init', '2342435819568558');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2342435819568558&ev=PageView&noscript=1"
/></noscript>
<link rel="stylesheet" href="/tc-ui.css">
<script src="/tc-ui.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;color:#a1a1aa;font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(700px 420px at 50% 30%,rgba(14,224,207,.08),transparent 65%);pointer-events:none}
.card{position:relative;text-align:center;max-width:420px;width:100%}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:26px;color:#f4f4f5;font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo svg{width:40px;height:40px}
.logo b{color:#0ee0cf;font-weight:700}
.ico{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#25D366;color:#fff}
.ico.tg{background:#2AABEE}
.ico svg{width:34px;height:34px;fill:currentColor}
.ttl{font-size:22px;font-weight:700;color:#f4f4f5;letter-spacing:-.02em;margin-bottom:8px}
.hint{font-size:14.5px;color:#71717a;margin-bottom:22px;line-height:1.45}
/* форма моста: контакт скрыт (подставляется мессенджер), видна только кнопка → слайдер */
.tc-form{text-align:left}
.tc-form .slide-confirm{width:100%;margin-top:0}
.go{display:flex;width:100%;align-items:center;justify-content:center;gap:9px;padding:16px 30px;border-radius:60px;font-size:16px;font-weight:700;border:0;cursor:pointer;font-family:inherit;color:#fff;background:#25D366;transition:transform .2s}
.go.tg{background:#2AABEE}
.go:active{transform:scale(.97)}
.go[hidden]{display:none}
.note{margin-top:18px;font-size:13px;color:#52525b;line-height:1.45}
.field-error{display:none}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg viewBox="0 0 40 40" fill="none"><rect x="1" y="1" width="38" height="38" rx="10" fill="#0e0e12" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/><text x="6" y="28" font-family="Inter,sans-serif" font-weight="900" font-size="22" fill="#f4f4f5">T</text><text x="19" y="28" font-family="Inter,sans-serif" font-weight="900" font-size="22" fill="#0ee0cf">C</text></svg>Traffic <b>Craft</b></div>
  <div class="ico" id="ico"><svg id="goIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></div>
  <div class="ttl" id="ttl">Открыть чат в WhatsApp</div>
  <div class="hint">Один свайп — и откроется чат с нами.<br>Это защита от ботов, людям он не мешает.</div>
  <form class="tc-form" id="goForm" data-form-location="bridge" onsubmit="return false">
    <input type="hidden" name="contact" value="messenger">
    <div style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
    <p class="field-error" hidden></p>
    <button type="submit" class="go" id="go"><span id="goTxt">Открыть WhatsApp</span></button>
  </form>
  <div class="note">Пишете нам первый раз? Расскажите в двух словах про клинику и город — так ответим быстрее.</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function once(key){
    try { if (sessionStorage.getItem(key)) return false;
          sessionStorage.setItem(key, '1'); return true; }
    catch (e) { return true; }
  }
  function cookie(n){ var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }

  /* параметры: белый список, мусор молча заменяется дефолтами */
  var q = new URLSearchParams(location.search);
  var m = q.get('m') === 'tg' ? 'tg' : 'wa';
  var pl = String(q.get('pl') || '');
  if (!/^[a-z0-9-]{1,16}$/i.test(pl)) pl = 'other';

  var WA_TEXT = 'Добрый день! Пишу по поводу рекламы с сайта';
  /* калькулятор передает свой расчет через sessionStorage: WhatsApp получит его
     в тексте ссылки, для Telegram скопируем в буфер на свайпе. Только текст,
     до 500 символов, без управляющих символов; в разметку не попадает */
  var HAND = '';
  try { HAND = String(sessionStorage.getItem('tc_go_text') || '').replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 500).trim(); sessionStorage.removeItem('tc_go_text'); } catch (e) {}
  if (HAND) WA_TEXT = HAND;
  var DEST = m === 'tg'
    ? 'https://t.me/PPavel_D'
    : 'https://wa.me/77782182305?text=' + encodeURIComponent(WA_TEXT);
  var NAME = m === 'tg' ? 'Telegram' : 'WhatsApp';

  if (m === 'tg') {
    document.getElementById('ttl').textContent = 'Открыть чат в Telegram';
    document.getElementById('goTxt').textContent = 'Открыть Telegram';
    document.getElementById('go').classList.add('tg');
    document.getElementById('ico').classList.add('tg');
    document.getElementById('goIco').innerHTML = '<path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.492-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>';
  }

  if (!window.LeadGuard) return; /* без скрипта кнопка ничего не делает - лучше, чем пустить бота */

  var isFirst = false, leadEid = '';
  LeadGuard.init({
    formSelector: 'form.tc-form',
    endpoint: '/api/request?m=1',   /* ?m=1: мосту не нужна выдержка токена (ветка msg его не проверяет) */
    thankYouUrl: DEST,              /* «спасибо» моста = сам мессенджер */
    text: {
      hint: 'Проведите вправо',
      aria: 'Ползунок: проведите вправо до конца, чтобы открыть ' + NAME,
      confirm: 'Открыть ' + NAME,
      sending: (HAND && m === 'tg') ? 'Расчёт скопирован · открываем Telegram…' : 'Открываем ' + NAME + '…'
    },
    onEvent: function (name) {
      if (name !== 'lead_confirmed') return;
      /* Telegram не умеет предзаполнять чат ссылкой - кладем расчет в буфер */
      if (HAND && m === 'tg' && navigator.clipboard && navigator.clipboard.writeText) { try { navigator.clipboard.writeText(HAND).catch(function () {}); } catch (e) {} }
      /* Lead - один на вкладку, каким бы путем человек ни пошел (тот же ключ tc_lead
         пишут формы). Contact - на каждый переход. Всё - ПОСЛЕ свайпа */
      isFirst = once('tc_lead');
      try {
        if (isFirst) {
          leadEid = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
          fbq('track', 'Lead', { content_category: 'messenger_' + m, placement: pl, value: 0, currency: 'KZT' }, { eventID: leadEid });
        }
        fbq('track', 'Contact', { content_category: 'messenger_' + m, placement: pl });
      } catch (e) {}
    },
    extraPayload: function () {
      /* заметка «Ушел в WhatsApp» в группу + серверный дубль Lead (CAPI) */
      var ref = document.referrer || '', utm = {};
      try { var ru = ref ? new URL(ref) : null; if (ru) ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) { var v = ru.searchParams.get(k); if (v) utm[k] = v; }); } catch (e) {}
      var fbc = cookie('_fbc'), fbp = cookie('_fbp');
      try { fbc = fbc || localStorage.getItem('_fbc') || ''; fbp = fbp || localStorage.getItem('_fbp') || ''; } catch (e) {}
      return {
        kind: 'msg', messenger: m, placement: pl,
        first: isFirst ? 1 : 0, leadEventId: leadEid,
        page: ref || location.href,
        utm_source: utm.utm_source || '', utm_medium: utm.utm_medium || '', utm_campaign: utm.utm_campaign || '',
        fbc: fbc, fbp: fbp
      };
    }
  });
  /* слайдер - сразу, без лишнего клика по кнопке */
  var form = document.getElementById('goForm');
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
});
</script>
</body>
</html>
